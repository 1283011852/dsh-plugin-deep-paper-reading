name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tag matches package.json version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          }

      - name: Build the .dshpreset package
        run: node scripts/build-dshpreset.mjs

      - name: Publish the preset package as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.dshpreset \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
