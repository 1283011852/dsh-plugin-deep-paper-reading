name: ci

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML and Pillow
        run: python3 -m pip install --quiet pyyaml pillow

      # The renderer discovers CJK fonts from a fixed candidate list. Installing
      # one here means the selftest actually exercises Chinese label rendering
      # instead of skipping past it with a warning.
      - name: Install a CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      # Static shape checks: bundle manifest, patch override keys, preset and
      # skill metadata, plus (since 0.2.0) every `references/` / `assets/` /
      # `scripts/` path SKILL.md tells the agent to open, and the V1–V8 figure
      # contract. The real composition check is `dsh --profile <name>
      # --dump-config`, which needs an installed harness and stays manual.
      - name: Check composition shape
        run: python3 scripts/check-composition.py

      # Renders all four diagram kinds, checks the PNG sizes and asserts that a
      # spec without a `source` line is rejected. A renderer that silently
      # produces blank images would let every report claim figures it never drew.
      - name: Diagram renderer self-test
        run: python3 scripts/check-render-selftest.py

      - name: Build the .dshpreset package
        run: node scripts/build-dshpreset.mjs

      - name: Package opens and holds the expected layout
        run: |
          set -euo pipefail
          archive=$(ls dist/*.dshpreset | head -n1)
          unzip -l "$archive"
          unzip -p "$archive" manifest.json | python3 -c "
          import json, sys
          m = json.load(sys.stdin)
          assert m['format'] == 'dsh-preset', m
          assert m['version'] == 1, m
          print('manifest ok:', m['id'])
          "
          for expected in \
            preset/agent.cordis.yml \
            preset/skills/deep-paper-reading/SKILL.md \
            preset/skills/deep-paper-reading/scripts/render-diagram.py \
            preset/skills/deep-paper-reading/references/visualization-spec.md \
            preset/skills/deep-paper-reading/references/docx-conversion-standard.md \
            preset/skills/deep-paper-reading/assets/diagram-specs.md; do
            unzip -l "$archive" | grep -q "$expected" || {
              echo "missing from package: $expected"
              exit 1
            }
          done
