name: ci

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle manifest points at an existing patch
        run: |
          set -euo pipefail
          patch=$(node -p "require('./package.json').dsh.bundle.patch")
          test -f "$patch" || { echo "dsh.bundle.patch does not exist: $patch"; exit 1; }
          grep -q '"presets"' package.json || { echo "package.json files[] must ship presets/"; exit 1; }

      - name: Composition and patch files parse as YAML
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          files = ['cordis.patch.yml'] + glob.glob('presets/*/agent.cordis.yml') + glob.glob('presets/*/preset.yml')
          for path in files:
              with open(path, encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print('ok', path)
          PY

      - name: Roster override restates every key the row requires
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml
          # A patch REPLACES the whole config of the row it targets, so a missing
          # key is not a fallback — it is an invalid roster row. Assert all of them.
          entries = yaml.safe_load(open('cordis.patch.yml', encoding='utf-8'))
          override = next((e for e in entries if e.get('id') == 'agent-presets'), None)
          if override is None:
              sys.exit('cordis.patch.yml has no agent-presets override')
          config = override.get('config') or {}
          for key in ('default', 'includeShippedRoot', 'includeUserRoot', 'roots'):
              if key not in config:
                  sys.exit(f'agent-presets override is missing required key: {key}')
          if not config['roots']:
              sys.exit('agent-presets override declares no roots')
          inserted = [e for e in entries if 'insert' in e]
          if not inserted:
              sys.exit('cordis.patch.yml has no insert entry')
          print('ok: agent-presets override restates', ', '.join(sorted(config)))
          PY

      - name: Bundled skill has a valid name and description
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          paths = glob.glob('presets/*/skills/*/SKILL.md')
          if not paths:
              sys.exit('no bundled skill found under presets/*/skills/*/SKILL.md')
          for path in paths:
              text = open(path, encoding='utf-8').read()
              if not text.startswith('---'):
                  sys.exit(f'{path} has no YAML frontmatter')
              front = yaml.safe_load(text.split('---', 2)[1])
              name, description = front.get('name'), front.get('description')
              if not name or not description:
                  sys.exit(f'{path} frontmatter needs name and description')
              if path.split('/')[-2] != name:
                  sys.exit(f'{path}: directory name and skill name differ ({name})')
              print('ok', path, '->', name)
          PY

      - name: Build the .dshpreset package
        run: node scripts/build-dshpreset.mjs

      - name: Package opens and holds the expected layout
        run: |
          set -euo pipefail
          archive=$(ls dist/*.dshpreset | head -n1)
          unzip -l "$archive"
          unzip -p "$archive" manifest.json | python3 -c "import json,sys; m=json.load(sys.stdin); assert m['format']=='dsh-preset', m; assert m['version']==1, m; print('manifest ok:', m['id'])"
          unzip -l "$archive" | grep -q 'preset/agent.cordis.yml' || { echo 'preset/agent.cordis.yml missing from package'; exit 1; }
          unzip -l "$archive" | grep -q 'preset/skills/deep-paper-reading/SKILL.md' || { echo 'bundled skill missing from package'; exit 1; }
